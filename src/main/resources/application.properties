spring.application.name=currency-exchange-service

# Database Configuration
spring.datasource.url=jdbc:postgresql://postgres:5432/currencydb
spring.datasource.username=postgres
spring.datasource.password=postgres
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA Configuration
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=true

# Liquibase Configuration
spring.liquibase.enabled=true
spring.liquibase.change-log=classpath:db/changelog/db.changelog-master.xml

# Exchange API Configuration
exchange.api.fixer.url=https://api.exchangeratesapi.io/latest
exchange.api.base-currency=EUR
exchange.fetch.rate=3600000

# Logging
logging.level.com.example.currencyexchange=INFO
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE

# Server Configuration
server.port=8080
